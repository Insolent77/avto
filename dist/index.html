<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c11"><meta name="description" content="GRAPHITE — мобильная онлайн-запись в детейлинг-студию. Выберите услугу и удобное время."><title>GRAPHITE — детейлинг и онлайн-запись</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="preload" href="assets/studio-hero-v2.png" as="image"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="design.css"></head>
<body><div class="shell"><header><a href="#home" class="brand" aria-label="Главная"><svg viewBox="0 0 40 25" aria-hidden="true"><path d="M4 16h23l7-7H11L4 16Zm6-11h26M2 21h25"/></svg><span id="brand">GRAPHITE</span></a><div class="header-right"><span class="studio-label">DETAILING STUDIO</span><button class="icon-button" id="owner-open" aria-label="Кабинет мастера"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="3"/><path d="M5.5 18c1-5.5 12-5.5 13 0"/></svg></button></div></header>
<div id="mode" class="mode" role="status"></div><main id="view" tabindex="-1"></main>
<footer><span id="footer-brand">GRAPHITE</span><span>Внимание к каждой детали.</span><button id="install">На главный экран ↗</button></footer></div>
<nav class="bottom-nav" aria-label="Основная навигация"><span class="nav-indicator" aria-hidden="true"></span><button data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg>Главная</button><button data-view="services"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Услуги</button><button data-view="bookings"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 5 2 2 5-4"/></svg>Моя запись<span class="booking-dot" hidden></span></button></nav>
<dialog id="booking-dialog" aria-label="Онлайн-запись"><div class="sheet-handle" aria-hidden="true"></div><div class="dialog-top"><span class="eyebrow">ОНЛАЙН-ЗАПИСЬ</span><button class="icon-button" id="booking-close" aria-label="Закрыть">×</button></div><div class="booking-progress" aria-label="Шаги записи"><span>Услуга</span><span>Время</span><span>Контакты</span></div><div id="booking-content"></div></dialog>
<dialog id="info-dialog"><div class="dialog-top"><strong id="info-title"></strong><button class="icon-button" id="info-close" aria-label="Закрыть">×</button></div><div id="info-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
